<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',sans-serif;background:#07080E;color:#EAE8FF;overflow-x:hidden;min-height:100vh}
#star-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;width:100%;height:100%}
#root{position:relative;z-index:1}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
.blink-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C9A84C;animation:blink 1.3s ease-in-out infinite;vertical-align:middle;margin-left:5px}
.ring-pulse{position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(201,168,76,.4);animation:ring 1.8s ease-out infinite;pointer-events:none}
.marquee-inner{display:flex;gap:2.5rem;animation:marquee 24s linear infinite;white-space:nowrap}
.nl-desktop{display:flex}
.hamburger-btn{display:none !important}
@media(max-width:768px){
  .nl-desktop{display:none !important}
  .nc-desktop{display:none !important}
  .hamburger-btn{display:flex !important}
  .hero-content{padding:0 1.25rem 4rem !important}
  .hero-badge{left:1.25rem !important;top:68px !important}
  .hero-status{right:1.25rem !important;top:68px !important}
  .sp{padding:3.5rem 1.25rem !important}
  .cd-num{font-size:1.3rem !important}
  .cd-cell{padding:.75rem .5rem !important}
  .ga{grid-template-columns:1fr !important}
  footer{flex-direction:column;gap:1rem;text-align:center;padding:1.5rem 1.25rem !important}
  .rhi{grid-template-columns:1fr !important}
  .exi{grid-template-columns:1fr !important;gap:.5rem !important}
  .jhi{padding:5rem 1.25rem 3rem !important}
  .mig{grid-template-columns:16px 1fr !important;gap:1rem !important}
  .stars-pad{padding:3rem 1.25rem !important}
}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#07080E}
::-webkit-scrollbar-thumb{background:#2A2A3A;border-radius:3px}
</style>

<body>
<canvas id="star-canvas"></canvas>
<div id="root"></div>
<script>
(function(){
  const canvas=document.getElementById('star-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,stars=[],shoots=[],t=0;
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;initStars();}
  function initStars(){
    stars=[];
    for(let i=0;i<300;i++){
      stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.2,
        alpha:Math.random()*0.6+0.2,phase:Math.random()*Math.PI*2,
        speed:Math.random()*0.022+0.005,
        col:Math.random()>0.85?[255,232,160]:Math.random()>0.7?[176,200,255]:[220,215,255]});
    }
  }
  function spawnShoot(){
    if(shoots.length<4&&Math.random()<0.016){
      shoots.push({x:Math.random()*W*0.75+W*0.05,y:Math.random()*H*0.5,
        vx:Math.random()*9+6,vy:Math.random()*9+6,
        len:Math.random()*130+70,life:1,decay:Math.random()*0.024+0.016,w:Math.random()*1.5+0.5});
    }
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    // Milky Way band
    var band=ctx.createLinearGradient(W*0.1,H*0.05,W*0.9,H*0.95);
    band.addColorStop(0,'rgba(40,35,90,0)');
    band.addColorStop(0.25,'rgba(65,52,140,0.07)');
    band.addColorStop(0.5,'rgba(90,72,180,0.13)');
    band.addColorStop(0.75,'rgba(65,52,140,0.07)');
    band.addColorStop(1,'rgba(40,35,90,0)');
    ctx.fillStyle=band;ctx.fillRect(0,0,W,H);
    // Nebula pockets
    [[W*0.3,H*0.25,160,60,'130,100,255'],[W*0.65,H*0.55,200,70,'80,110,255'],[W*0.5,H*0.4,120,45,'160,120,255']].forEach(function(n){
      ctx.save();ctx.translate(n[0],n[1]);
      var g=ctx.createRadialGradient(0,0,0,0,0,n[2]);
      g.addColorStop(0,'rgba('+n[4]+',0.07)');g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.scale(1,n[3]/n[2]);ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(0,0,n[2],0,Math.PI*2);ctx.fill();ctx.restore();
    });
    // Stars
    stars.forEach(function(s){
      var a=s.alpha*(0.5+0.5*Math.sin(t*s.speed+s.phase));
      if(s.r>1.0){
        var glow=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*4);
        glow.addColorStop(0,'rgba('+s.col[0]+','+s.col[1]+','+s.col[2]+','+a*0.4+')');
        glow.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=glow;ctx.beginPath();ctx.arc(s.x,s.y,s.r*4,0,Math.PI*2);ctx.fill();
      }
      ctx.fillStyle='rgba('+s.col[0]+','+s.col[1]+','+s.col[2]+','+a+')';
      ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    });
    // Shooting stars
    spawnShoot();
    shoots=shoots.filter(function(s){return s.life>0;});
    shoots.forEach(function(s){
      var angle=Math.atan2(s.vy,s.vx);
      var ex=s.x-Math.cos(angle)*s.len,ey=s.y-Math.sin(angle)*s.len;
      var g=ctx.createLinearGradient(ex,ey,s.x,s.y);
      g.addColorStop(0,'rgba(255,255,230,0)');
      g.addColorStop(0.6,'rgba(255,255,210,'+s.life*0.7+')');
      g.addColorStop(1,'rgba(255,255,255,'+s.life+')');
      ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(s.x,s.y);
      ctx.strokeStyle=g;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.stroke();
      ctx.fillStyle='rgba(255,255,245,'+s.life*0.9+')';
      ctx.beginPath();ctx.arc(s.x,s.y,s.w*1.6,0,Math.PI*2);ctx.fill();
      s.x+=s.vx;s.y+=s.vy;s.life-=s.decay;
    });
    t++;requestAnimationFrame(draw);
  }
  window.addEventListener('resize',resize);
  resize();draw();
})();
</script>

// ── STAR CANVAS ─────────────────────────────────────────────────────────────
function StarCanvas() {
  const canvasRef = useRef(null);
  const animRef = useRef(null);
  const starsRef = useRef([]);
  const shootsRef = useRef([]);

  const init = useCallback((canvas) => {
    const W = canvas.width = window.innerWidth;
    const H = canvas.height = window.innerHeight;
    starsRef.current = Array.from({ length: 300 }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.5 + 0.2,
      a: Math.random() * 0.7 + 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.018 + 0.004,
    }));
  }, []);

  useEffect(() => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    init(canvas);

    const onResize = () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init(canvas);
    };
    window.addEventListener("resize", onResize);

    let t = 0;
    const draw = () => {
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);

      // Milky Way band
      const band = ctx.createLinearGradient(0, H * 0.2, W, H * 0.8);
      band.addColorStop(0, "rgba(60,50,120,0)");
      band.addColorStop(0.3, "rgba(80,60,150,0.06)");
      band.addColorStop(0.5, "rgba(100,80,180,0.09)");
      band.addColorStop(0.7, "rgba(80,60,150,0.06)");
      band.addColorStop(1, "rgba(60,50,120,0)");
      ctx.fillStyle = band;
      ctx.fillRect(0, 0, W, H);

      // Stars
      starsRef.current.forEach(s => {
        const alpha = s.a * (0.6 + 0.4 * Math.sin(t * s.speed + s.phase));
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220,215,255,${alpha})`;
        ctx.fill();
      });

      // Shooting stars
      if (shootsRef.current.length < 3 && Math.random() < 0.015) {
        shootsRef.current.push({
          x: Math.random() * W * 0.7 + W * 0.05,
          y: Math.random() * H * 0.45,
          len: Math.random() * 120 + 60,
          angle: Math.PI / 4 + (Math.random() * 0.3 - 0.15),
          speed: Math.random() * 14 + 8,
          life: 1,
        });
      }
      shootsRef.current = shootsRef.current.filter(s => s.life > 0);
      shootsRef.current.forEach(s => {
        const ex = s.x + Math.cos(s.angle) * s.len;
        const ey = s.y + Math.sin(s.angle) * s.len;
        const grad = ctx.createLinearGradient(s.x, s.y, ex, ey);
        grad.addColorStop(0, `rgba(255,255,220,0)`);
        grad.addColorStop(0.3, `rgba(255,255,220,${s.life * 0.9})`);
        grad.addColorStop(1, `rgba(255,255,220,0)`);
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        ctx.lineTo(ex, ey);
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        s.x += Math.cos(s.angle) * s.speed;
        s.y += Math.sin(s.angle) * s.speed;
        s.life -= 0.03;
      });

      t++;
      animRef.current = requestAnimationFrame(draw);
    };
    draw();
    return () => {
      cancelAnimationFrame(animRef.current);
      window.removeEventListener("resize", onResize);
    };
  }, [init]);

  return (
    <canvas ref={canvasRef} style={{
      position: "fixed", inset: 0, zIndex: 0, pointerEvents: "none",
      width: "100%", height: "100%",
    }} />
  );
}

// ── COUNTDOWN ────────────────────────────────────────────────────────────────
function useCountdown() {
  const TARGET = new Date("2026-12-31T23:59:59+05:30").getTime();
  const START = new Date("2025-01-01T00:00:00+05:30").getTime();
  const [time, setTime] = useState({});
  const [pct, setPct] = useState(0);

  useEffect(() => {
    const tick = () => {
      const diff = Math.max(0, TARGET - Date.now());
      setTime({
        d: String(Math.floor(diff / 86400000)).padStart(3, "0"),
        h: String(Math.floor((diff % 86400000) / 3600000)).padStart(2, "0"),
        m: String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0"),
        s: String(Math.floor((diff % 60000) / 1000)).padStart(2, "0"),
      });
      const p = Math.min(100, Math.max(0, ((Date.now() - START) / (TARGET - START)) * 100));
      setPct(p.toFixed(1));
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);

  return { time, pct };
}

function Countdown({ maxWidth = 420 }) {
  const { time, pct } = useCountdown();
  const sep = { background: BG3, display: "flex", alignItems: "center", padding: "0 3px", color: DIM, fontFamily: "'DM Mono',monospace", fontSize: "1.2rem", paddingBottom: "1.2rem" };
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", fontSize: ".72rem", color: DIM, fontFamily: "'DM Mono',monospace", marginBottom: ".4rem", maxWidth }}>
        <span>Journey start · Jan 2025</span><span>{pct}% of the way there</span>
      </div>
      <div style={{ height: 2, background: BG3, borderRadius: 1, overflow: "hidden", maxWidth, marginBottom: "1rem" }}>
        <div style={{ height: "100%", width: pct + "%", background: GOLD, borderRadius: 1, transition: "width 1s" }} />
      </div>
      <div style={{ display: "flex", gap: 1, background: BORDER, border: `1px solid ${BORDER}`, borderRadius: 4, overflow: "hidden", maxWidth }}>
        {[["d", "Days"], ["h", "Hours"], ["m", "Mins"], ["s", "Secs"]].map(([k, u], i) => (
          <>
            {i > 0 && <div style={sep}>:</div>}
            <div key={k} style={{ background: BG3, padding: "1rem 1.25rem", textAlign: "center", flex: 1 }}>
              <span style={{ fontFamily: "'DM Mono',monospace", fontSize: "1.8rem", color: GOLD, display: "block", lineHeight: 1, marginBottom: ".3rem" }}>{time[k]}</span>
              <span style={{ fontSize: ".6rem", color: DIM, letterSpacing: ".12em", textTransform: "uppercase", fontFamily: "'DM Mono',monospace" }}>{u}</span>
            </div>
          </>
        ))}
      </div>
    </div>
  );
}
